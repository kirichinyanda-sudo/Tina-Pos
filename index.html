    function bindLicenseGenerator() {
      const form = document.getElementById('lic-gen-form');
      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          if (!isMasterAdmin()) return;
          const plan = document.getElementById('lic-plan').value === 'yearly' ? 'yearly' : 'monthly';
          const qty = Math.min(50, Math.max(1, parseInt(document.getElementById('lic-qty').value, 10) || 1));
          state.licGenPlan = plan;
          state.licGenQty = qty;

          const all = getLicenses();
          const existingSet = new Set(all.map((x) => x.code));
          const created = [];
          const today = todayStr();
          for (let i = 0; i < qty; i++) {
            const lic = {
              id: uid('lic'),
              code: buildUniqueLicenseCode(plan, existingSet),
              plan,
              days: plan === 'yearly' ? 365 : 30,
              price: plan === 'yearly' ? 50.00 : 6.00,
              status: 'Unused',
              usedBy: '',
              createdAt: today,
              usedAt: ''
            };
            created.push(lic);
          }
          setLicenses([...created, ...all]);
          state.lastGeneratedBatch = created;
          toast('Generated ' + qty + ' ' + plan + ' license code(s).', 'success');
          render();
        };
      }

      const searchEl = document.getElementById('lic-search');
      if (searchEl) {
        searchEl.oninput = (e) => {
          state.licSearch = e.target.value;
          const q = state.licSearch.trim().toLowerCase();
          const filtered = getLicenses().filter((l) => {
            const matchQ = !q || l.code.toLowerCase().includes(q) || (l.usedBy || '').toLowerCase().includes(q);
            const matchF = state.licFilter === 'all' || l.status.toLowerCase() === state.licFilter;
            return matchQ && matchF;
          });
          const tbody = document.getElementById('lic-tbody');
          if (tbody) {
            tbody.innerHTML = renderLicenseTableRowsHtml(filtered);
            bindLicenseRowActions();
          }
        };
      }

      document.querySelectorAll('[data-lic-filter]').forEach((b) => {
        b.onclick = () => {
          state.licFilter = b.getAttribute('data-lic-filter');
          render();
        };
      });

      const expBtn = document.getElementById('lic-export-csv');
      if (expBtn) {
        expBtn.onclick = () => {
          const all = getLicenses();
          exportCSV(
            'tina_license_codes_' + todayStr() + '.csv',
            ['Code', 'Plan', 'Days', 'Price USD', 'Status', 'Used By', 'Date Generated', 'Date Used'],
            all.map((l) => [l.code, l.plan, l.days, (l.price || 0).toFixed(2), l.status, l.usedBy || '', l.createdAt || '', l.usedAt || ''])
          );
        };
      }

      bindLicenseRowActions();
    }

    // =========================================================================
    // TAB 8: SETTINGS (Shop, Backup, Supabase Cloud Sync, PWA & Updates)
    // =========================================================================
    function renderSettings() {
      const s = getSettings();
      const isAdmin = hasRole(['Admin']);
      const lastBackup = localStorage.getItem(K.LAST_BACKUP) || 'Never';
      const autoBackup = localStorage.getItem(K.AUTO_BACKUP) !== 'false';
      const lastSync = localStorage.getItem(K.LAST_SYNC);
      const pendingSync = localStorage.getItem(K.PENDING_SYNC) === 'true';
      const { sub, daysLeft, expired, planLabel } = getSubInfo();

      let inner = '';
      if (state.settingsTab === 'shop') {
        const { validUntil } = getSubInfo();
        inner = `
          <div class="grid-2">
            <div class="card">
              <h2 class="card-title mb-3">Shop &amp; Receipt Customisation</h2>
              <form id="set-form">
                <div class="form-grid mb-3">
                  <div>
                    <label for="set-name">Business Name</label>
                    <input id="set-name" type="text" value="${esc(s.businessName)}" required />
                  </div>
                  <div>
                    <label for="set-wa">WhatsApp Number (Shown on Receipt)</label>
                    <input id="set-wa" type="text" value="${esc(s.whatsappNumber || WHATSAPP_DISPLAY)}" placeholder="0719881550" required />
                  </div>
                </div>
                <div class="mb-3">
                  <label for="set-address">Shop Address</label>
                  <input id="set-address" type="text" value="${esc(s.address || s.phoneAddress || '')}" placeholder="e.g. Shop 4, Samora Machel Ave, Harare" />
                </div>
                <div class="mb-3">
                  <label for="set-ecocash">EcoCash Payment Number (Seller Config)</label>
                  <input id="set-ecocash" type="text" value="${esc(s.ecocashNumber || ECOCASH_NUMBER)}" placeholder="TBA or 077XXXXXXX" />
                  <div style="font-size:11px;color:var(--text-muted);margin-top:4px;">
                    Keep as <strong>TBA</strong> to show "EcoCash Number Coming Soon - Pay via WhatsApp for now".
                  </div>
                </div>
                <div class="form-grid mb-3">
                  <div>
                    <label for="set-width">Thermal Paper Width</label>
                    <select id="set-width">
                      <option value="58" ${s.paperWidth === '58' ? 'selected' : ''}>58mm (32 columns)</option>
                      <option value="80" ${s.paperWidth === '80' ? 'selected' : ''}>80mm (48 columns)</option>
                    </select>
                  </div>
                  <div>
                    <label for="set-footer">Thank You Message (Receipt Footer)</label>
                    <input id="set-footer" type="text" value="${esc(s.footerNote || 'Thank you for shopping with us!')}" />
                  </div>
                </div>
                <button type="submit" class="btn-primary">Save Settings</button>
              </form>
            </div>

            <div class="card">
              <h2 class="card-title mb-3">Subscription &amp; Support</h2>
              <div class="alert-banner ${expired ? 'alert-danger' : 'alert-info'}">
                <span>Plan: <strong>${esc(planLabel)}</strong> · Valid until: <strong class="tabular">${esc(validUntil)}</strong> (${daysLeft}d left)</span>
                <button type="button" class="btn-primary btn-sm" id="set-open-sub">Activate / Upgrade</button>
              </div>
              <p style="font-size:13px;color:var(--text-secondary);">
                Last Code: <strong class="tabular">${esc(sub.lastCode || '-')}</strong> · EcoCash: <strong>${esc(getEcoCashDisplay(s))}</strong>
              </p>
              <div class="flex-row mb-3">
                <a class="wa-link-btn" href="${WHATSAPP_BASE}" target="_blank" rel="noopener noreferrer">Chat on WhatsApp (${WHATSAPP_DISPLAY})</a>
              </div>
              ${isAdmin ? `
                <div class="alert-banner alert-danger mt-4">
                  <span>Danger Zone: Erase all shop data and reset defaults.</span>
                  <button type="button" class="btn-danger btn-sm" id="set-clear-all">Clear All Data</button>
                </div>
              ` : `
                <div class="alert-banner alert-warning mt-4">
                  <span>Only Admin users can clear all application data.</span>
                </div>
              `}
            </div>
          </div>
        `;
      } else if (state.settingsTab === 'backup') {
        inner = `
          <div class="grid-2">
            <div class="card">
              <h2 class="card-title mb-3">Backup &amp; Restore</h2>
              <div class="alert-banner alert-info">
                <span>Last Backup</span>
                <strong class="tabular">${esc(lastBackup)}</strong>
              </div>
              <p style="font-size:13px;color:var(--text-secondary);">
                Export a complete JSON backup (products, sales, purchases, stocktakes, users, settings, subscription) saved as <strong>tina-backup-${todayStr()}.json</strong>.
              </p>
              <div class="flex-row mt-3">
                <button type="button" class="btn-primary" id="bak-export">Export Backup (JSON)</button>
                <button type="button" class="btn-secondary" id="bak-import-btn">Import Backup (Restore)</button>
                <input type="file" id="bak-file" accept=".json,application/json" class="hidden" />
              </div>
            </div>

            <div class="card">
              <h2 class="card-title mb-3">Auto Backup Reminder</h2>
              <p style="font-size:13px;color:var(--text-secondary);margin-top:0;">
                Remind daily at the top of the screen if no backup has been exported today.
              </p>
              <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;">
                <input type="checkbox" id="bak-auto-toggle" ${autoBackup ? 'checked' : ''} style="width:20px;height:20px;min-height:20px;" />
                <span>Enable Daily Auto Backup Reminder</span>
              </label>
            </div>
          </div>
        `;
      } else if (state.settingsTab === 'sync') {
        inner = `
          <div class="grid-2">
            <div class="card">
              <h2 class="card-title mb-3">Multi-Device Cloud Sync (Supabase)</h2>
              <div class="alert-banner ${state.isOnline ? 'alert-info' : 'alert-warning'}">
                <span>${state.isOnline ? 'Online' : 'Offline Mode (Local)'} · ${pendingSync ? 'Pending local changes' : 'Up to date'}</span>
                <span class="tabular" style="font-size:11px;">${lastSync ? 'Last: ' + esc(timeStr(lastSync)) : 'Not synced yet'}</span>
              </div>
              <form id="sync-form">
                <div class="mb-3">
                  <label for="sync-shop-id">Shop ID (use same ID across all devices)</label>
                  <input id="sync-shop-id" type="text" value="${esc(s.shopId)}" placeholder="e.g. tina-harare-01" required />
                </div>
                <div class="mb-3">
                  <label for="sync-url">Supabase Project URL</label>
                  <input id="sync-url" type="url" value="${esc(s.supabaseUrl)}" placeholder="https://your-project.supabase.co" />
                </div>
                <div class="mb-3">
                  <label for="sync-key">Supabase Anon Public Key</label>
                  <input id="sync-key" type="password" value="${esc(s.supabaseAnonKey)}" placeholder="eyJhbGciOi..." />
                </div>
                <label style="display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:14px;">
                  <input type="checkbox" id="sync-auto" ${s.autoSync ? 'checked' : ''} style="width:20px;height:20px;min-height:20px;" />
                  <span>Auto Sync when Online (real-time multi-device)</span>
                </label>
                <div class="flex-row">
                  <button type="submit" class="btn-primary">Save Sync Config</button>
                  <button type="button" class="btn-secondary" id="sync-push">Sync Now</button>
                  <button type="button" class="btn-secondary" id="sync-pull">Pull from Cloud</button>
                </div>
              </form>
            </div>

            <div class="card">
              <h2 class="card-title mb-3">Where to Get Supabase URL &amp; Key</h2>
              <ol style="font-size:13px;color:var(--text-secondary);padding-left:18px;margin-top:0;">
                <li>Create a free project at <strong>supabase.com</strong>.</li>
                <li>Go to <strong>Project Settings &rarr; API</strong>. Copy <strong>Project URL</strong> into Supabase URL and <strong>anon public</strong> key into Supabase Anon Key above.</li>
                <li>Open <strong>SQL Editor</strong> in Supabase and run this table setup once:</li>
              </ol>
              <div class="sql-box">${esc(SUPABASE_SQL)}</div>
              <button type="button" class="btn-secondary btn-sm" id="sync-copy-sql">Copy SQL</button>
            </div>
          </div>
        `;
      } else {
        inner = `
          <div class="grid-2">
            <div class="card">
              <h2 class="card-title mb-3">App Version &amp; Updates</h2>
              <div class="alert-banner alert-info">
                <span>Current Installed Version</span>
                <strong class="tabular">${APP_VERSION}</strong>
              </div>
              <p style="font-size:13px;color:var(--text-secondary);">
                Updates install seamlessly through the Service Worker without uninstalling the app or losing any sales, stock, or customer data.
              </p>
              <div class="flex-row mt-3">
                <button type="button" class="btn-primary" id="upd-check">Check for Updates</button>
                ${state.updateAvailable ? '<button type="button" class="btn-success" id="upd-apply">Update Now</button>' : ''}
              </div>
            </div>

            <div class="card">
              <h2 class="card-title mb-3">Install App (PWA)</h2>
              <p style="font-size:13px;color:var(--text-secondary);margin-top:0;">
                Install <strong>Tina POS</strong> to your Android, iOS, or Desktop Home Screen for fullscreen offline launch.
              </p>
              ${state.isInstalled
                ? '<div class="alert-banner alert-success"><span>Installed in Standalone PWA Mode</span></div>'
                : (state.deferredInstallPrompt || state.isIOS
                    ? '<button type="button" class="btn-primary" id="set-install-pwa">Add to Home Screen / Install</button>'
                    : '<div class="alert-banner alert-info"><span>Use Chrome menu &rarr; "Add to Home Screen" or "Install app"</span></div>')}
            </div>
          </div>
        `;
      }

      return `
        <div class="tabs-bar">
          <button type="button" class="tab-btn ${state.settingsTab === 'shop' ? 'active' : ''}" data-set-tab="shop">Shop &amp; License</button>
          <button type="button" class="tab-btn ${state.settingsTab === 'backup' ? 'active' : ''}" data-set-tab="backup">Backup</button>
          <button type="button" class="tab-btn ${state.settingsTab === 'sync' ? 'active' : ''}" data-set-tab="sync">Cloud Sync</button>
          <button type="button" class="tab-btn ${state.settingsTab === 'updates' ? 'active' : ''}" data-set-tab="updates">Updates &amp; PWA (${APP_VERSION})</button>
        </div>
        ${inner}
      `;
    }

    function bindSettings() {
      document.querySelectorAll('[data-set-tab]').forEach((b) => {
        b.onclick = () => { state.settingsTab = b.getAttribute('data-set-tab'); render(); };
      });

      const form = document.getElementById('set-form');
      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          const cur = getSettings();
          const wa = (document.getElementById('set-wa').value || '').trim() || WHATSAPP_DISPLAY;
          const addr = (document.getElementById('set-address').value || '').trim();
          setSettings({
            ...cur,
            businessName: document.getElementById('set-name').value.trim() || 'Tina POS',
            whatsappNumber: wa,
            address: addr,
            phoneAddress: [addr, wa ? 'WhatsApp: ' + wa : ''].filter(Boolean).join(' · '),
            ecocashNumber: (document.getElementById('set-ecocash').value || '').trim() || ECOCASH_NUMBER,
            paperWidth: document.getElementById('set-width').value,
            footerNote: document.getElementById('set-footer').value.trim() || 'Thank you for shopping with us!'
          });
          toast('Settings saved.', 'success');
          render();
        };
      }

      const openSub = document.getElementById('set-open-sub');
      if (openSub) openSub.onclick = () => { state.showSubscriptionGate = true; render(); };

      const clr = document.getElementById('set-clear-all');
      if (clr) {
        clr.onclick = () => {
          if (!hasRole(['Admin'])) return;
          openModal(`
            <div class="modal-head">
              <h3 class="modal-title">Clear All Data</h3>
              <button type="button" class="btn-secondary btn-sm" id="ca-close">Cancel</button>
            </div>
            <div class="alert-banner alert-danger">
              This will permanently erase all sales, purchases, stocktakes, products, and reset default demo accounts.
            </div>
            <div class="flex-row" style="justify-content:flex-end;margin-top:16px;">
              <button type="button" class="btn-secondary" id="ca-cancel">Cancel</button>
              <button type="button" class="btn-danger" id="ca-confirm">Yes, Clear Everything</button>
            </div>
          `);
          document.getElementById('ca-close').onclick = closeModal;
          document.getElementById('ca-cancel').onclick = closeModal;
          document.getElementById('ca-confirm').onclick = () => {
            Object.values(K).forEach((key) => localStorage.removeItem(key));
            initStorage();
            state.user = null;
            state.cart = [];
            state.activeStocktake = null;
            closeModal();
            toast('All data cleared and defaults restored.', 'success');
            render();
          };
        };
      }

      const expBtn = document.getElementById('bak-export');
      if (expBtn) expBtn.onclick = exportJsonBackup;
      const impBtn = document.getElementById('bak-import-btn');
      const impFile = document.getElementById('bak-file');
      if (impBtn && impFile) {
        impBtn.onclick = () => impFile.click();
        impFile.onchange = (e) => {
          if (e.target.files && e.target.files[0]) importJsonBackup(e.target.files[0]);
        };
      }
      const autoBak = document.getElementById('bak-auto-toggle');
      if (autoBak) {
        autoBak.onchange = (e) => {
          localStorage.setItem(K.AUTO_BACKUP, e.target.checked ? 'true' : 'false');
          toast('Auto Backup Reminder ' + (e.target.checked ? 'enabled' : 'disabled') + '.', 'success');
          render();
        };
      }

      const syncForm = document.getElementById('sync-form');
      if (syncForm) {
        syncForm.onsubmit = (e) => {
          e.preventDefault();
          const cur = getSettings();
          setSettings({
            ...cur,
            shopId: document.getElementById('sync-shop-id').value.trim() || 'tina-shop-01',
            supabaseUrl: document.getElementById('sync-url').value.trim(),
            supabaseAnonKey: document.getElementById('sync-key').value.trim(),
            autoSync: document.getElementById('sync-auto').checked
          });
          toast('Cloud Sync settings saved.', 'success');
          render();
        };
      }
      const pushBtn = document.getElementById('sync-push');
      if (pushBtn) pushBtn.onclick = () => pushToSupabase(false);
      const pullBtn = document.getElementById('sync-pull');
      if (pullBtn) pullBtn.onclick = () => pullFromSupabase(false);
      const copySql = document.getElementById('sync-copy-sql');
      if (copySql) {
        copySql.onclick = () => {
          if (navigator.clipboard) navigator.clipboard.writeText(SUPABASE_SQL);
          toast('SQL copied to clipboard!', 'success');
        };
      }

      const updCheck = document.getElementById('upd-check');
      if (updCheck) {
        updCheck.onclick = async () => {
          if ('serviceWorker' in navigator) {
            try {
              const reg = await navigator.serviceWorker.getRegistration();
              if (reg) {
                await reg.update();
                if (reg.waiting) {
                  state.waitingSW = reg.waiting;
                  state.updateAvailable = true;
                  toast('New update ready to install!', 'success');
                  render();
                  return;
                }
              }
            } catch (e) {}
          }
          toast('Tina POS ' + APP_VERSION + ' is up to date.', 'success');
        };
      }
      const updApply = document.getElementById('upd-apply');
      if (updApply) updApply.onclick = applyAppUpdate;

      const setInst = document.getElementById('set-install-pwa');
      if (setInst) setInst.onclick = triggerPWAInstall;
    }

    // =========================================================================
    // MAIN SHELL RENDERER
    // =========================================================================
    function render() {
      if (!state.user) {
        renderLogin();
        return;
      }

      const subInfo = getSubInfo();
      const master = isMasterAdmin();
      const needsFirstTrialWelcome = !master && subInfo.sub.plan === 'trial' && !subInfo.expired && !localStorage.getItem(K.TRIAL_WELCOMED);
      if (!master && (subInfo.expired || state.showSubscriptionGate || needsFirstTrialWelcome)) {
        closeModal();
        renderSubscriptionScreen();
        return;
      }

      const tabs = allowedTabs();
      if (!tabs.some((t) => t.id === state.tab)) {
        state.tab = tabs[0].id;
      }

      const dayOpen = isDayOpen();
      const day = getDay();
      const lastBackup = localStorage.getItem(K.LAST_BACKUP) || '';
      const autoBackupOn = localStorage.getItem(K.AUTO_BACKUP) !== 'false';
      const showBackupReminder = autoBackupOn && !state.backupReminderDismissed && !lastBackup.startsWith(todayStr());

      let content = '';
      if (state.tab === 'dashboard') content = renderDashboard();
      else if (state.tab === 'pos') content = renderPOS();
      else if (state.tab === 'today') content = renderTodaySales();
      else if (state.tab === 'stock') content = renderStock();
      else if (state.tab === 'purchases') content = renderPurchases();
      else if (state.tab === 'expenses') content = renderExpenses();
      else if (state.tab === 'credit') content = renderCreditBook();
      else if (state.tab === 'stocktake') content = renderStocktake();
      else if (state.tab === 'reports') content = renderReports();
      else if (state.tab === 'users') content = renderUsers();
      else if (state.tab === 'settings') content = renderSettings();
      else if (state.tab === 'licenses' && master) content = renderLicenseGenerator();

      const canShowInstallBtn = !state.isInstalled && (state.deferredInstallPrompt || state.isIOS);

      const app = document.getElementById('app');
      app.innerHTML = `
        ${state.updateAvailable ? `
          <div class="system-banner no-print">
            <span>New Update Available (${APP_VERSION}) — Update without losing data</span>
            <button type="button" class="btn-success btn-sm" id="banner-update-now">Update Now</button>
          </div>
        ` : ''}

        ${showBackupReminder ? `
          <div class="system-banner backup no-print">
            <span>Daily Auto Backup Reminder: Export today's backup (${todayStr()}).</span>
            <div class="flex-row">
              <button type="button" class="btn-primary btn-sm" id="banner-backup-now">Backup Now</button>
              <button type="button" class="btn-secondary btn-sm" id="banner-backup-dismiss">Later</button>
            </div>
          </div>
        ` : ''}

        <header class="topbar">
          <div class="topbar-inner">
            <div class="brand">
              <div class="brand-pill">
                <div class="brand-logo-sm">${tinaLogoSvg(38)}</div>
                <div class="brand-text">
                  <div class="brand-name"><span class="brand-tina">Tina</span> <span class="brand-pos">POS</span></div>
                  <div class="brand-tagline">Sell Smart. Stock Smart.</div>
                </div>
              </div>
            </div>

            <div class="topbar-right">
              <button type="button" class="sub-pill-btn ${subInfo.expired && !master ? 'expired' : ''}" id="hdr-sub" title="License Validity">
                ${master ? 'Master Admin' : `Valid until: ${esc(subInfo.validUntil)} - ${subInfo.daysLeft} days left`}
              </button>
              <a class="wa-header-link" href="${WHATSAPP_BASE}" target="_blank" rel="noopener noreferrer" title="WhatsApp Support ${WHATSAPP_DISPLAY}">WhatsApp Help</a>
              <span class="day-badge ${dayOpen ? 'open' : 'closed'}">
                ${dayOpen ? 'DAY OPEN · ' + esc(day.date) : 'NO DAY OPEN'}
              </span>
              ${dayOpen
                ? '<button type="button" class="btn-header" id="hdr-eod">End Day</button>'
                : '<button type="button" class="btn-primary btn-sm" id="hdr-sod">Start Day</button>'}
              ${canShowInstallBtn ? '<button type="button" class="btn-header" id="hdr-install">Install App</button>' : ''}
              <span class="user-meta"><strong>${esc(state.user.name)}</strong> (${esc(state.user.role)})</span>
              <button type="button" class="btn-header" id="hdr-logout">Logout</button>
            </div>
          </div>
        </header>

        <nav class="nav-bar" aria-label="Main navigation">
          <div class="nav-links" id="nav-links-scroll">
            ${tabs.map((t) => `
              <button
                type="button"
                class="nav-btn ${state.tab === t.id ? 'active' : ''}"
                data-nav="${t.id}"
                title="${esc(t.label)}"
                aria-label="${esc(t.label)}"
                aria-current="${state.tab === t.id ? 'page' : 'false'}"
              >
                ${TAB_ICONS[t.id] || ''}
                <span class="nav-label">${esc(t.label)}</span>
              </button>
            `).join('')}
          </div>
        </nav>

        <main class="main-wrap">
          ${content}
        </main>
      `;

      const updBannerBtn = document.getElementById('banner-update-now');
      if (updBannerBtn) updBannerBtn.onclick = applyAppUpdate;
      const bakNow = document.getElementById('banner-backup-now');
      if (bakNow) bakNow.onclick = exportJsonBackup;
      const bakDis = document.getElementById('banner-backup-dismiss');
      if (bakDis) bakDis.onclick = () => { state.backupReminderDismissed = true; render(); };

      document.querySelectorAll('[data-nav]').forEach((b) => {
        b.onclick = () => { state.tab = b.getAttribute('data-nav'); render(); };
      });
      const activeNavBtn = document.querySelector('.nav-btn.active');
      if (activeNavBtn && typeof activeNavBtn.scrollIntoView === 'function') {
        activeNavBtn.scrollIntoView({ inline: 'nearest', block: 'nearest' });
      }

      document.getElementById('hdr-sub').onclick = () => {
        if (master) {
          state.tab = 'licenses';
        } else {
          state.showSubscriptionGate = true;
        }
        render();
      };
      document.getElementById('hdr-logout').onclick = logout;
      const eodBtn = document.getElementById('hdr-eod');
      if (eodBtn) eodBtn.onclick = openEndOfDayModal;
      const sodBtn = document.getElementById('hdr-sod');
      if (sodBtn) sodBtn.onclick = showStartOfDayGate;
      const instBtn = document.getElementById('hdr-install');
      if (instBtn) instBtn.onclick = triggerPWAInstall;

      if (state.tab === 'dashboard') bindDashboard();
      else if (state.tab === 'pos') bindPOS();
      else if (state.tab === 'today') bindTodaySales();
      else if (state.tab === 'stock') bindStock();
      else if (state.tab === 'purchases') bindPurchases();
      else if (state.tab === 'expenses') bindExpenses();
      else if (state.tab === 'credit') bindCreditBook();
      else if (state.tab === 'stocktake') bindStocktake();
      else if (state.tab === 'reports') bindReports();
      else if (state.tab === 'users') bindUsers();
      else if (state.tab === 'settings') bindSettings();
      else if (state.tab === 'licenses' && master) bindLicenseGenerator();

      if (!dayOpen) {
        showStartOfDayGate();
      }
    }

    initStorage();
    initPWA();
    initConnectivityAndSync();
    render();

    const splashEl = document.getElementById('splash-screen');
    if (splashEl) {
      setTimeout(() => {
        splashEl.classList.add('hide');
        setTimeout(() => {
          if (splashEl.parentNode) splashEl.parentNode.removeChild(splashEl);
        }, 300);
      }, 420);
    }
  })();
  </script>
</body>
</html>
