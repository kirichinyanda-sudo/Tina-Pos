<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tina POS &amp; Stock Management — Sell Smart. Stock Smart.</title>
  <meta name="description" content="Tina POS &amp; Stock Management: Sell Smart. Stock Smart. Offline-first PWA POS, Inventory, Stocktake, Z-Reports, EcoCash Licensing, Backup, Supabase Cloud Sync, and Bluetooth Printing." />
  <meta property="og:title" content="Tina POS &amp; Stock Management" />
  <meta property="og:description" content="Sell Smart. Stock Smart. Offline-first POS &amp; Stock Management for retail shops." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="theme-color" content="#0EA5E9" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Tina POS" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <style>
    :root {
      --bg: #F0F9FF;
      --surface: #FFFFFF;
      --surface-muted: #F8FAFC;
      --border: #BAE6FD;
      --border-neutral: #E2E8F0;
      --border-strong: #CBD5E1;
      --header-bg: #0369A1;
      --nav-bg: #075985;
      --header-surface: #0284C7;
      --header-text: #FFFFFF;
      --header-muted: #E0F2FE;
      --text: #0F172A;
      --text-secondary: #334155;
      --text-muted: #64748B;
      --accent: #0EA5E9;
      --accent-hover: #0284C7;
      --accent-light: #E0F2FE;
      --accent-border: #7DD3FC;
      --success: #059669;
      --success-light: #ECFDF5;
      --success-border: #A7F3D0;
      --danger: #DC2626;
      --danger-hover: #B91C1C;
      --danger-light: #FEF2F2;
      --danger-border: #FECACA;
      --warning: #D97706;
      --warning-light: #FFFBEB;
      --warning-border: #FDE68A;
      --radius: 10px;
      --radius-lg: 14px;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }

    .tabular {
      font-variant-numeric: tabular-nums;
      font-family: var(--font-mono);
    }

    button, input, select, textarea {
      font-family: inherit;
      font-size: 14px;
    }

    button {
      cursor: pointer;
      border: 1px solid transparent;
      border-radius: var(--radius);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 600;
      min-height: 44px;
      padding: 8px 16px;
      transition: background-color 140ms ease, border-color 140ms ease, transform 80ms ease, color 140ms ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    button:active:not(:disabled) { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    .btn-primary { background: var(--accent); color: #FFFFFF; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-dark { background: var(--header-bg); color: #FFFFFF; }
    .btn-dark:hover:not(:disabled) { background: var(--nav-bg); }
    .btn-success { background: var(--success); color: #FFFFFF; }
    .btn-success:hover:not(:disabled) { background: #047857; }
    .btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border-strong); }
    .btn-secondary:hover:not(:disabled) { background: var(--bg); border-color: var(--accent); }
    .btn-danger { background: var(--danger); color: #FFFFFF; }
    .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }
    .btn-warning { background: var(--warning); color: #FFFFFF; }
    .btn-warning:hover:not(:disabled) { background: #B45309; }
    .btn-sm { min-height: 36px; padding: 6px 12px; font-size: 13px; }
    .btn-lg { min-height: 52px; padding: 12px 20px; font-size: 16px; }
    .btn-block { width: 100%; }

    input[type="text"], input[type="password"], input[type="number"], input[type="date"], input[type="url"], select, textarea {
      width: 100%;
      min-width: 0;
      min-height: 44px;
      padding: 8px 12px;
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--text);
    }
    textarea { min-height: 76px; resize: vertical; }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border-neutral);
      border-radius: var(--radius-lg);
      padding: 18px;
      min-width: 0;
      max-width: 100%;
      box-shadow: 0 1px 3px rgba(3, 105, 161, 0.06);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .card-title {
      font-size: 17px;
      font-weight: 700;
      margin: 0;
      color: var(--text);
    }

    /* Update / Reminder Top Strip */
    .system-banner {
      background: #0C4A6E;
      color: #FFFFFF;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,255,255,0.18);
    }
    .system-banner.backup {
      background: #FEF3C7;
      color: #92400E;
      border-bottom: 1px solid #FDE68A;
    }

    /* Header & Responsive Navigation */
    .topbar {
      background: var(--header-bg);
      color: var(--header-text);
      border-bottom: 1px solid rgba(255,255,255,0.14);
      width: 100%;
    }
    .topbar-inner {
      max-width: 1440px;
      margin: 0 auto;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1 1 auto;
    }
    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      padding: 5px 12px 5px 6px;
      border-radius: 14px;
      box-shadow: 0 2px 8px rgba(3, 105, 161, 0.22);
      max-width: 100%;
      min-width: 0;
    }
    .brand-logo-sm {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(14, 165, 233, 0.28);
    }
    .brand-text {
      min-width: 0;
      display: flex;
      flex-direction: column;
    }
    .brand-name {
      font-size: 16px;
      font-weight: 800;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
    }
    .brand-tina { color: #0369A1; font-weight: 900; }
    .brand-pos { color: #0EA5E9; font-weight: 900; }
    .brand-tagline {
      font-size: 11px;
      color: #64748B;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 600;
    }
    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 100%;
    }
    .day-badge {
      padding: 5px 10px;
      border-radius: 7px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.02em;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .day-badge.open {
      background: #065F46;
      color: #A7F3D0;
      border: 1px solid #10B981;
    }
    .day-badge.closed {
      background: #991B1B;
      color: #FECACA;
      border: 1px solid #EF4444;
    }
    .sub-pill-btn {
      background: rgba(255,255,255,0.14);
      color: #FFFFFF;
      border: 1px solid rgba(186,230,253,0.45);
      min-height: 34px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 7px;
      white-space: nowrap;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .sub-pill-btn:hover { background: rgba(255,255,255,0.22); }
    .sub-pill-btn.expired {
      background: #DC2626;
      border-color: #FCA5A5;
    }
    .wa-link-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: #16A34A;
      color: #FFFFFF;
      border: 1px solid #15803D;
      border-radius: var(--radius);
      min-height: 40px;
      padding: 6px 14px;
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .wa-link-btn:hover { background: #15803D; }
    .wa-link-btn.sm { min-height: 34px; padding: 4px 10px; font-size: 12px; }
    .wa-header-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: #16A34A;
      color: #FFFFFF;
      border: 1px solid #86EFAC;
      border-radius: 7px;
      min-height: 32px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 700;
      text-decoration: none;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .wa-header-link:hover { background: #15803D; }
    .lic-badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }
    .lic-badge.unused { background: var(--success-light); color: #065F46; border: 1px solid var(--success-border); }
    .lic-badge.used { background: var(--accent-light); color: #075985; border: 1px solid var(--accent-border); }
    .lic-badge.revoked { background: var(--danger-light); color: #991B1B; border: 1px solid var(--danger-border); }
    .user-meta {
      font-size: 12px;
      color: var(--header-muted);
      white-space: nowrap;
    }
    .user-meta strong { color: #FFFFFF; }
    .btn-header {
      background: rgba(255,255,255,0.14);
      color: #FFFFFF;
      border: 1px solid rgba(255,255,255,0.28);
      min-height: 36px;
      padding: 6px 11px;
      font-size: 12px;
    }
    .btn-header:hover { background: rgba(255,255,255,0.24); }

    /* Second-row Navigation Bar */
    .nav-bar {
      background: var(--nav-bg);
      border-bottom: 1px solid rgba(255,255,255,0.12);
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
    }
    .nav-links {
      max-width: 1440px;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .nav-btn {
      background: rgba(255,255,255,0.08);
      color: #E0F2FE;
      border: 1px solid rgba(255,255,255,0.14);
      min-height: 38px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      flex-shrink: 0;
    }
    .nav-btn:hover { color: #FFFFFF; background: rgba(14,165,233,0.45); border-color: #7DD3FC; }
    .nav-btn.active {
      color: #FFFFFF;
      background: var(--accent);
      border-color: #BAE6FD;
      box-shadow: 0 2px 8px rgba(0,0,0,0.22);
    }
    .nav-btn svg {
      width: 17px;
      height: 17px;
      flex-shrink: 0;
    }

    /* Main Container */
    .main-wrap {
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px;
      width: 100%;
    }

    /* Login & Subscription Screen */
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: linear-gradient(155deg, #0369A1 0%, #0EA5E9 52%, #BAE6FD 100%);
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: #FFFFFF;
      border-radius: 22px;
      padding: 30px 26px;
      border: 1px solid rgba(186, 230, 253, 0.9);
      box-shadow: 0 24px 55px rgba(3, 105, 161, 0.28);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .login-logo-box {
      width: 80px;
      height: 80px;
      border-radius: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      box-shadow: 0 14px 30px rgba(14, 165, 233, 0.34);
    }
    .scanner-video {
      width: 100%;
      max-height: 280px;
      border-radius: 14px;
      background: #0F172A;
      object-fit: cover;
      display: block;
    }
    .chart-svg { width: 100%; height: auto; display: block; }
    .rank-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 28px;
      height: 24px;
      padding: 0 7px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 800;
      background: var(--accent-light);
      color: var(--header-bg);
    }
    .rank-badge.top {
      background: #FEF3C7;
      color: #92400E;
      border: 1px solid #FDE68A;
    }
    .demo-accounts {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border-neutral);
    }
    .demo-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-top: 8px;
    }

    /* Subscription Plans */
    .plan-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 14px 0;
    }
    .plan-card {
      border: 2px solid var(--border-neutral);
      border-radius: 12px;
      padding: 14px;
      background: var(--surface);
      text-align: left;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      min-height: 106px;
      white-space: normal;
      width: 100%;
      position: relative;
    }
    .plan-card.selected {
      border-color: var(--accent);
      background: var(--bg);
      box-shadow: 0 0 0 2px rgba(14, 165, 233, 0.2);
    }
    .plan-tag {
      font-size: 10px;
      font-weight: 800;
      color: #FFFFFF;
      background: var(--success);
      padding: 2px 7px;
      border-radius: 5px;
      letter-spacing: 0.03em;
    }

    /* Grids & Layouts */
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .split-sidebar { display: grid; grid-template-columns: 380px minmax(0, 1fr); gap: 16px; align-items: start; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border-neutral);
      border-radius: var(--radius);
      padding: 14px 16px;
      min-width: 0;
      box-shadow: 0 1px 2px rgba(3, 105, 161, 0.05);
    }
    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .stat-value {
      font-size: clamp(16px, 2.2vw, 22px);
      font-weight: 800;
      color: var(--text);
      overflow-wrap: anywhere;
    }
    .stat-value.danger { color: var(--danger); }
    .stat-value.accent { color: var(--header-bg); }

    /* POS Layout */
    .pos-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 390px;
      gap: 16px;
      align-items: start;
    }
    .pos-search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      min-width: 0;
      flex-wrap: wrap;
    }
    .pos-search-bar input {
      flex: 1 1 180px;
    }
    .cat-bar {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 8px;
      margin-bottom: 8px;
    }
    .cat-bar::-webkit-scrollbar { display: none; }
    .cat-btn {
      min-height: 36px;
      padding: 6px 12px;
      font-size: 13px;
      background: var(--surface);
      border: 1px solid var(--border-strong);
      color: var(--text-secondary);
    }
    .cat-btn.active {
      background: var(--accent);
      color: #FFFFFF;
      border-color: var(--accent);
    }
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
      gap: 10px;
    }
    .product-tile {
      background: var(--surface);
      border: 1px solid var(--border-neutral);
      border-radius: var(--radius);
      padding: 12px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      min-height: 108px;
      white-space: normal;
      font-weight: 400;
      width: 100%;
      min-width: 0;
    }
    .product-tile:hover:not(:disabled) {
      border-color: var(--accent);
      background: var(--bg);
    }
    .product-tile.out {
      opacity: 0.55;
      background: var(--surface-muted);
    }
    .product-tile-name {
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .product-tile-sku {
      font-size: 11px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .product-tile-foot {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 6px;
      width: 100%;
      margin-top: auto;
    }
    .product-price {
      font-size: 15px;
      font-weight: 800;
      color: var(--header-bg);
    }
    .stock-tag {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .stock-tag.low { color: var(--danger); }

    /* Cart */
    .cart-panel {
      background: var(--surface);
      border: 1px solid var(--border-neutral);
      border-radius: var(--radius-lg);
      padding: 16px;
      position: sticky;
      top: 64px;
      min-width: 0;
      box-shadow: 0 1px 3px rgba(3, 105, 161, 0.06);
    }
    .cart-items {
      max-height: 290px;
      overflow-y: auto;
      border-top: 1px solid var(--border-neutral);
      border-bottom: 1px solid var(--border-neutral);
      margin: 10px 0;
    }
    .cart-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 6px;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #F1F5F9;
    }
    .cart-row:last-child { border-bottom: none; }
    .qty-ctrl {
      display: inline-flex;
      align-items: center;
      border: 1px solid var(--border-strong);
      border-radius: 8px;
      overflow: hidden;
    }
    .qty-ctrl button {
      min-height: 34px;
      min-width: 30px;
      padding: 0 6px;
      border-radius: 0;
      background: var(--surface-muted);
      color: var(--text);
      border: none;
    }
    .qty-ctrl input {
      width: 38px;
      min-height: 34px;
      padding: 2px 2px;
      text-align: center;
      border: none;
      border-left: 1px solid var(--border-neutral);
      border-right: 1px solid var(--border-neutral);
      border-radius: 0;
      font-weight: 700;
    }
    .pay-methods {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin: 8px 0 12px;
    }
    .pay-btn {
      min-height: 42px;
      padding: 6px 4px;
      font-size: 12px;
      background: var(--surface-muted);
      color: var(--text-secondary);
      border: 1px solid var(--border-strong);
    }
    .pay-btn.active {
      background: var(--header-bg);
      color: #FFFFFF;
      border-color: var(--header-bg);
    }
    .quick-cash {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin: 8px 0;
    }
    .summary-line {
      display: flex;
      justify-content: space-between;
      align-items: center;

    function initPWA() {

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then((reg) => {
          if (reg.waiting) {
            state.waitingSW = reg.waiting;
            state.updateAvailable = true;
            render();
          }
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                state.waitingSW = newWorker;
                state.updateAvailable = true;
                render();
              }
            });
          });
        }).catch(() => {});
      }
    }

    let syncTimer = null;

    function isSyncConfigured() {

    function buildFullPayload() {
      return {
        version: APP_VERSION,
        updatedAt: localStorage.getItem(K.DATA_UPDATED_AT) || new Date().toISOString(),
        products: getProducts(),
        sales: getSales(),
        purchases: getPurchases(),

        users: getUsers(),

        daySession: getDay()
      };
    }

    function mergeById(localArr, remoteArr) {
      const map = new Map();
      (localArr || []).forEach((item) => { if (item && item.id) map.set(item.id, item); });
      (remoteArr || []).forEach((item) => { if (item && item.id && !map.has(item.id)) map.set(item.id, item); });
      return Array.from(map.values()).sort((a, b) => {
        const ta = a.timestamp || a.closedAt || a.date || '';
        const tb = b.timestamp || b.closedAt || b.date || '';
        return ta < tb ? 1 : (ta > tb ? -1 : 0);
      });
    }

    async function pushToSupabase(silent) {
      const s = getSettings();
      if (!isSyncConfigured()) {
        if (!silent) toast('Enter Shop ID, Supabase URL, and Anon Key first.', 'error');
        return;
      }
      if (!navigator.onLine) {
        localStorage.setItem(K.PENDING_SYNC, 'true');
        if (!silent) toast('Offline: changes saved locally and queued to sync later.', 'warning');
        return;
      }
      state.isSyncing = true;
      try {
        const base = s.supabaseUrl.replace(/\/+$/, '');
        const res = await fetch(base + '/rest/v1/tina_shop_sync?on_conflict=shop_id', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': s.supabaseAnonKey,
            'Authorization': 'Bearer ' + s.supabaseAnonKey,
            'Prefer': 'resolution=merge-duplicates,return=minimal'
          },
          body: JSON.stringify({
            shop_id: s.shopId.trim(),
            payload: buildFullPayload(),
            updated_at: new Date().toISOString()
          })
        });
        if (!res.ok) {
          throw new Error('HTTP ' + res.status + ' — check Supabase URL, Key, or table SQL.');
        }
        localStorage.setItem(K.PENDING_SYNC, 'false');
        localStorage.setItem(K.LAST_SYNC, new Date().toISOString());
        if (!silent) toast('Synced shop data to Supabase!', 'success');
      } catch (err) {
        if (!silent) toast('Sync failed: ' + err.message, 'error');
      } finally {
        state.isSyncing = false;
        if (!silent) render();
      }
    }

    async function pullFromSupabase(silent) {
      const s = getSettings();
      if (!isSyncConfigured() || !navigator.onLine) {
        if (!silent) toast('Connect online and configure Supabase first.', 'error');
        return;
      }
      try {
        const base = s.supabaseUrl.replace(/\/+$/, '');
        const url = base + '/rest/v1/tina_shop_sync?shop_id=eq.' + encodeURIComponent(s.shopId.trim()) + '&select=payload,updated_at';
        const res = await fetch(url, {
          headers: {
            'apikey': s.supabaseAnonKey,
            'Authorization': 'Bearer ' + s.supabaseAnonKey
          }
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const rows = await res.json();
        if (!rows || rows.length === 0 || !rows[0].payload) {
          if (!silent) toast('No remote data yet for Shop ID "' + s.shopId + '". Pushing local data...', '');
          await pushToSupabase(silent);
          return;
        }
        const remote = rows[0].payload;
        const localUpdated = localStorage.getItem(K.DATA_UPDATED_AT) || '';
        const remoteUpdated = remote.updatedAt || rows[0].updated_at || '';

        const mergedSales = mergeById(getSales(), remote.sales);
        const mergedPurchases = mergeById(getPurchases(), remote.purchases);
        const mergedExpenses = mergeById(getExpenses(), remote.expenses);
        const mergedStocktakes = mergeById(getStocktakes(), remote.stocktakes);
        const mergedEods = mergeById(getEods(), remote.eodReports);

        saveJSON(K.SALES, mergedSales, true);
        saveJSON(K.PURCHASES, mergedPurchases, true);
        saveJSON(K.EXPENSES, mergedExpenses, true);
        saveJSON(K.STOCKTAKES, mergedStocktakes, true);
        saveJSON(K.EOD, mergedEods, true);

        const remoteIsNewer = remoteUpdated > localUpdated && localStorage.getItem(K.PENDING_SYNC) !== 'true';
        if (remoteIsNewer) {
          if (Array.isArray(remote.products)) saveJSON(K.PRODUCTS, remote.products, true);
          if (Array.isArray(remote.creditBook)) saveJSON(K.CREDIT, remote.creditBook, true);
          if (Array.isArray(remote.users) && remote.users.length > 0) saveJSON(K.USERS, remote.users, true);
          if (remote.daySession !== undefined) {
            if (remote.daySession) saveJSON(K.DAY, remote.daySession, true);
            else localStorage.removeItem(K.DAY);
          }
        }
        // Keep whichever subscription expires later
        if (remote.subscription && remote.subscription.expiresAt) {
          const curSub = getSub();
          if (new Date(remote.subscription.expiresAt) > new Date(curSub.expiresAt)) {
            saveJSON(K.SUBSCRIPTION, remote.subscription, true);
          }
        }
        // Merge license codes across devices (Revoked / Used status wins over Unused)
        if (Array.isArray(remote.licenses)) {
          const licMap = new Map();
          getLicenses().forEach((l) => { if (l && l.code) licMap.set(l.code, l); });
          remote.licenses.forEach((rl) => {
            if (!rl || !rl.code) return;
            const existing = licMap.get(rl.code);
            if (!existing) {
              licMap.set(rl.code, rl);
            } else if (rl.status === 'Revoked' || (rl.status === 'Used' && existing.status === 'Unused')) {
              licMap.set(rl.code, rl);
            }
          });
          saveJSON(K.LICENSES, Array.from(licMap.values()), true);
        }

        localStorage.setItem(K.LAST_SYNC, new Date().toISOString());
        if (localStorage.getItem(K.PENDING_SYNC) === 'true') {
          await pushToSupabase(true);
        }
        if (!silent) toast('Pulled & merged latest data for Shop ID: ' + s.shopId, 'success');
        render();
      } catch (err) {
        if (!silent) toast('Pull failed: ' + err.message, 'error');
      }
    }

    function initConnectivityAndSync() {
      window.addEventListener('online', () => {
        state.isOnline = true;
        toast('Back online!', 'success');
        if (getSettings().autoSync && isSyncConfigured()) {
          if (localStorage.getItem(K.PENDING_SYNC) === 'true') pushToSupabase(true);
          else pullFromSupabase(true);
        }
        render();
      });
      window.addEventListener('offline', () => {
        state.isOnline = false;
        toast('Offline mode — saving locally.', '');
        render();
      });
      setInterval(() => {
        if (state.user && navigator.onLine && !document.hidden && getSettings().autoSync && isSyncConfigured()) {
          if (localStorage.getItem(K.PENDING_SYNC) === 'true') pushToSupabase(true);
          else pullFromSupabase(true);
        }
      }, 12000);
    }

    // BACKUP & RESTORE (JSON)
    // =========================================================================
    function exportJsonBackup() {
      const payload = buildFullPayload();
      const filename = 'tina-backup-' + todayStr() + '.json';
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      localStorage.setItem(K.LAST_BACKUP, todayStr() + ' ' + timeStr());
      state.backupReminderDismissed = true;
      toast('Backup downloaded: ' + filename, 'success');
      render();
    }

    function importJsonBackup(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(String(reader.result || '{}'));
          if (!data || !Array.isArray(data.products) || !Array.isArray(data.users)) {
            throw new Error('Invalid Tina POS backup file.');
          }
          saveJSON(K.PRODUCTS, data.products, true);
          saveJSON(K.SALES, Array.isArray(data.sales) ? data.sales : [], true);
          saveJSON(K.PURCHASES, Array.isArray(data.purchases) ? data.purchases : [], true);
          saveJSON(K.EXPENSES, Array.isArray(data.expenses) ? data.expenses : [], true);
          saveJSON(K.CREDIT, Array.isArray(data.creditBook) ? data.creditBook : [], true);
          saveJSON(K.STOCKTAKES, Array.isArray(data.stocktakes) ? data.stocktakes : [], true);
          saveJSON(K.EOD, Array.isArray(data.eodReports) ? data.eodReports : [], true);
          saveJSON(K.USERS, data.users, true);
          if (data.settings) saveJSON(K.SETTINGS, { ...defaultSettings(), ...data.settings }, true);
          if (data.subscription) saveJSON(K.SUBSCRIPTION, data.subscription, true);
          if (Array.isArray(data.licenses)) saveJSON(K.LICENSES, data.licenses, true);
          if (data.daySession) saveJSON(K.DAY, data.daySession, true);
          else localStorage.removeItem(K.DAY);
          localStorage.setItem(K.DATA_UPDATED_AT, new Date().toISOString());
          localStorage.setItem(K.PENDING_SYNC, 'true');
          scheduleSyncPush();
          toast('Backup restored successfully!', 'success');
          render();
        } catch (err) {
          toast('Restore failed: ' + err.message, 'error');
        }
      };
      reader.readAsText(file);
    }

    // =========================================================================
    // BLUETOOTH ESC/POS PRINTING (Web Bluetooth API + 20-byte Chunking)
    // =========================================================================
    function lrLine(left, right, width) {
      left = String(left || '');
      right = String(right || '');
      const space = width - left.length - right.length;
      if (space >= 1) return left + ' '.repeat(space) + right;
      return left.slice(0, Math.max(1, width - right.length - 1)) + ' ' + right;
    }

    function encodeEscPosLines(blocks) {
      const encoder = new TextEncoder();
      const bytes = [];
      const push = (arr) => { for (let i = 0; i < arr.length; i++) bytes.push(arr[i]); };
      const text = (str) => push(encoder.encode(str + '\n'));

      push([0x1B, 0x40]);
      blocks.forEach((b) => {
        push([0x1B, 0x61, b.align || 0]);
        push([0x1B, 0x45, b.bold ? 1 : 0]);
        push([0x1D, 0x21, b.large ? 0x11 : 0x00]);
        text(b.text);
      });
      push([0x1B, 0x45, 0]);
      push([0x1D, 0x21, 0x00]);
      push([0x1B, 0x64, 4]);
      push([0x1D, 0x56, 0x42, 0x00]);
      return new Uint8Array(bytes);
    }

    async function sendBluetoothBytes(dataUint8) {
      if (!navigator.bluetooth) {
        throw new Error('Web Bluetooth not supported in this browser.');
      }

      const PRINTER_SERVICES = [
        '000018f0-0000-1000-8000-00805f9b34fb',
        'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        '0000ffe0-0000-1000-8000-00805f9b34fb',
        '0000ff00-0000-1000-8000-00805f9b34fb',
        '0000ae30-0000-1000-8000-00805f9b34fb'
      ];

      let char = state.bleCharacteristic;
      if (!char || !state.bleDevice || !state.bleDevice.gatt || !state.bleDevice.gatt.connected) {
        const device = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: PRINTER_SERVICES
        });
        const server = await device.gatt.connect();
        const services = await server.getPrimaryServices();
        let foundChar = null;
        for (const svc of services) {
          try {
            const chars = await svc.getCharacteristics();
            for (const c of chars) {
              if (c.properties.writeWithoutResponse || c.properties.write) {
                foundChar = c;
                break;
              }
            }
            if (foundChar) break;
          } catch (err) {}
        }
        if (!foundChar) {
          throw new Error('No writable GATT characteristic found on printer.');
        }
        state.bleDevice = device;
        state.bleCharacteristic = foundChar;
        char = foundChar;
      }

      const CHUNK_SIZE = 20;
      for (let offset = 0; offset < dataUint8.length; offset += CHUNK_SIZE) {
        const slice = dataUint8.slice(offset, offset + CHUNK_SIZE);
        if (char.properties.writeWithoutResponse && typeof char.writeValueWithoutResponse === 'function') {
          await char.writeValueWithoutResponse(slice);
        } else {
          await char.writeValue(slice);
        }
        await new Promise((r) => setTimeout(r, 20));
      }
    }

    async function printViaBluetooth(blocks) {
      try {
        toast('Connecting to Bluetooth printer...', '');
        const payload = encodeEscPosLines(blocks);
        await sendBluetoothBytes(payload);
        toast('Sent to Bluetooth printer!', 'success');
      } catch (err) {
        state.bleCharacteristic = null;
        openModal(`
          <div class="modal-head">
            <h3 class="modal-title">Bluetooth Print Unavailable</h3>
            <button type="button" class="btn-secondary btn-sm" id="bt-err-close">Close</button>
          </div>
          <div class="alert-banner alert-danger">
            Pair printer in Android Settings first, use Chrome
          </div>
          <p style="font-size:13px;color:var(--text-secondary);margin:8px 0 16px;">
            Details: ${esc(err && err.message ? err.message : 'Connection failed')}
          </p>
          <div class="flex-row" style="justify-content:flex-end;">
            <button type="button" class="btn-dark" id="bt-err-ok">OK</button>
          </div>
        `);

    }

    function buildSaleEscPosBlocks(sale) {
      const s = getSettings();
      const w = s.paperWidth === '80' ? 48 : 32;
      const hr = '-'.repeat(w);
      const waLine = 'WhatsApp: ' + (s.whatsappNumber || WHATSAPP_DISPLAY);
      const addrLine = s.address || s.phoneAddress || '';
      const blocks = [
        { text: s.businessName, align: 1, bold: true, large: true },
        { text: waLine, align: 1 },
        ...(addrLine ? [{ text: addrLine, align: 1 }] : []),
        { text: hr, align: 0 },
        { text: lrLine('Receipt:', sale.receiptNo, w), align: 0 },
        { text: lrLine('Date:', sale.date + ' ' + sale.time, w), align: 0 },
        { text: lrLine('Cashier:', sale.cashier, w), align: 0 },
        { text: lrLine('Method:', sale.paymentMethod, w), align: 0 },
        { text: hr, align: 0 }
      ];
      sale.items.forEach((it) => {
        blocks.push({ text: it.name, align: 0, bold: true });
        blocks.push({
          text: lrLine('  ' + it.qty + ' x ' + money(it.price), money(it.qty * it.price), w),
          align: 0
        });
      });
      blocks.push({ text: hr, align: 0 });
      blocks.push({ text: lrLine('TOTAL:', money(sale.total), w), align: 0, bold: true });
      blocks.push({ text: lrLine('PAID:', money(sale.amountPaid), w), align: 0 });
      blocks.push({ text: lrLine('CHANGE:', money(sale.change), w), align: 0 });
      if (sale.customerRef) {
        blocks.push({ text: lrLine('Ref:', sale.customerRef, w), align: 0 });
      }
      blocks.push({ text: hr, align: 0 });
      blocks.push({ text: s.footerNote || 'Thank you for shopping with us!', align: 1, bold: true });
      return blocks;
    }

    function computeShiftTotals(day) {
      const sales = getSales().filter((s) => s.dayId === day.id || (!s.dayId && s.date === day.date));
      const purchases = getPurchases().filter((p) => p.dayId === day.id || (!p.dayId && p.date === day.date));

      let cashSales = 0, ecocashSales = 0, cardSales = 0, creditSales = 0, totalSales = 0;
      sales.forEach((s) => {
        totalSales += s.total;
        if (s.paymentMethod === 'Cash') cashSales += s.total;
        else if (s.paymentMethod === 'EcoCash') ecocashSales += s.total;
        else if (s.paymentMethod === 'Card') cardSales += s.total;
        else if (s.paymentMethod === 'Credit') creditSales += s.total;
      });
      const totalPurchases = purchases.reduce((acc, p) => acc + p.totalCost, 0);
      const expectedCash = day.openingCash + cashSales;
      return {
        salesCount: sales.length,
        cashSales,
        ecocashSales,
        cardSales,
        creditSales,
        totalSales,
        purchasesCount: purchases.length,
        totalPurchases,
        expectedCash
      };
    }

        const counted = parseFloat(countedInput.value) || 0;
        const diff = counted - stats.expectedCash;
        const status = Math.abs(diff) < 0.005 ? 'Balanced' : (diff > 0 ? 'Over' : 'Short');
        diffVal.textContent = (diff >= 0 ? '+' : '-') + money(Math.abs(diff)) + ' (' + status + ')';
        diffBox.className = 'alert-banner ' + (status === 'Balanced' ? 'alert-success' : (status === 'Over' ? 'alert-warning' : 'alert-danger'));

    function shiftDateStr(baseDateStr, offsetDays) {
      const parts = (baseDateStr || todayStr()).split('-').map(Number);
      const d = new Date(parts[0], (parts[1] || 1) - 1, parts[2] || 1);
      d.setDate(d.getDate() + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    }

    function renderSevenDayChartSvg(today) {
      const allSales = getSales();
      const allExpenses = getExpenses();
      const allPurchases = getPurchases();
      const days = [];
      for (let i = 6; i >= 0; i--) {
        const d = shiftDateStr(today, -i);
        const sSum = allSales.filter((x) => x.date === d).reduce((a, x) => a + (Number(x.total) || 0), 0);
        const eSum = allExpenses.filter((x) => x.date === d).reduce((a, x) => a + (Number(x.amount) || 0), 0);
        const pSum = allPurchases.filter((x) => x.date === d).reduce((a, x) => a + (Number(x.totalCost) || 0), 0);
        days.push({ date: d, label: d.slice(5), sales: sSum, costs: eSum + pSum, profit: sSum - eSum - pSum });
      }
      const maxVal = Math.max(10, ...days.map((d) => Math.max(d.sales, d.costs)));
      const w = 560, h = 210, padL = 44, padR = 14, padT = 18, padB = 34;
      const plotW = w - padL - padR;
      const plotH = h - padT - padB;
      const groupW = plotW / days.length;
      const barW = Math.min(20, (groupW - 14) / 2);

      const gridLines = [0, 0.25, 0.5, 0.75, 1].map((frac) => {
        const y = (padT + plotH * (1 - frac)).toFixed(1);
        const val = Math.round(maxVal * frac);
        return `<line x1="${padL}" y1="${y}" x2="${w - padR}" y2="${y}" stroke="#E2E8F0" stroke-width="1"/>
                <text x="${padL - 6}" y="${Number(y) + 3}" text-anchor="end" font-size="10" fill="#64748B">$${val}</text>`;
      }).join('');

      const bars = days.map((d, idx) => {
        const cx = padL + idx * groupW + groupW / 2;
        const sH = (d.sales / maxVal) * plotH;
        const cH = (d.costs / maxVal) * plotH;
        const sY = padT + plotH - sH;
        const cY = padT + plotH - cH;
        return `
          <rect x="${(cx - barW - 2).toFixed(1)}" y="${sY.toFixed(1)}" width="${barW}" height="${Math.max(2, sH).toFixed(1)}" rx="4" fill="#0EA5E9">
            <title>${d.date} Sales: ${money(d.sales)}</title>
          </rect>
          <rect x="${(cx + 2).toFixed(1)}" y="${cY.toFixed(1)}" width="${barW}" height="${Math.max(2, cH).toFixed(1)}" rx="4" fill="#F59E0B">
            <title>${d.date} Purchases+Expenses: ${money(d.costs)}</title>
          </rect>
          <text x="${cx.toFixed(1)}" y="${h - 14}" text-anchor="middle" font-size="10" font-weight="700" fill="#334155">${esc(d.label)}</text>
          <text x="${cx.toFixed(1)}" y="${h - 3}" text-anchor="middle" font-size="9" font-weight="700" fill="${d.profit >= 0 ? '#059669' : '#DC2626'}">${d.profit >= 0 ? '+' : '-'}$${Math.abs(d.profit).toFixed(0)}</text>
        `;
      }).join('');

      return `
        <svg class="chart-svg" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="7-Day Sales vs Purchases and Expenses Chart">
          ${gridLines}
          ${bars}
        </svg>
      `;
    }

    function renderPaymentMixSvg(todaySalesList) {
      const methods = [
        { name: 'Cash', color: '#0EA5E9', total: 0 },
        { name: 'EcoCash', color: '#059669', total: 0 },
        { name: 'Card', color: '#0369A1', total: 0 },
        { name: 'Credit', color: '#DC2626', total: 0 }
      ];
      todaySalesList.forEach((s) => {
        const m = methods.find((x) => x.name === s.paymentMethod) || methods[0];
        m.total += Number(s.total) || 0;
      });
      const grand = methods.reduce((a, m) => a + m.total, 0);
      const r = 42, cx = 56, cy = 58, circ = 2 * Math.PI * r;
      let offset = 0;
      const segments = grand > 0
        ? methods.filter((m) => m.total > 0).map((m) => {
            const len = (m.total / grand) * circ;
            const seg = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${m.color}" stroke-width="18" stroke-dasharray="${len.toFixed(2)} ${circ.toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${cx} ${cy})" />`;
            offset += len;
            return seg;
          }).join('')
        : `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#E2E8F0" stroke-width="18" />`;

      const legend = methods.map((m, idx) => {
        const y = 26 + idx * 23;
        const pct = grand > 0 ? Math.round((m.total / grand) * 100) : 0;
        return `
          <rect x="128" y="${y - 9}" width="10" height="10" rx="3" fill="${m.color}" />
          <text x="144" y="${y}" font-size="11" font-weight="700" fill="#0F172A">${esc(m.name)}</text>
          <text x="292" y="${y}" text-anchor="end" font-size="11" font-weight="700" fill="#334155">${money(m.total)} (${pct}%)</text>
        `;
      }).join('');

      return `
        <svg class="chart-svg" viewBox="0 0 300 120" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Payment Methods Breakdown">
          ${segments}
          <text x="${cx}" y="${cy + 3}" text-anchor="middle" font-size="11" font-weight="800" fill="#0369A1">${money(grand)}</text>
          ${legend}
        </svg>
      `;
    }

    function addToCart(productId) {
      if (!requireDayOpen()) return;
      const products = getProducts();
      const prod = products.find((p) => p.id === productId);
      if (!prod) return;
      if (prod.qty <= 0) {
        toast(prod.name + ' is out of stock.', 'error');
        return;
      }
      const existing = state.cart.find((c) => c.productId === productId);
      if (existing) {
        if (existing.qty + 1 > prod.qty) {
          toast('Only ' + prod.qty + ' in stock for ' + prod.name, 'error');
          return;
        }
        existing.qty += 1;
      } else {
        state.cart.push({
          productId: prod.id,
          name: prod.name,
          price: prod.sellingPrice,
          costPrice: prod.costPrice,
          qty: 1
        });
      }
      render();
    }

    function updateCartQty(productId, newQty) {
      const qty = parseInt(newQty, 10);
      if (isNaN(qty) || qty <= 0) {
        state.cart = state.cart.filter((c) => c.productId !== productId);
        render();
        return;
      }
      const prod = getProducts().find((p) => p.id === productId);
      const maxQty = prod ? prod.qty : qty;
      const item = state.cart.find((c) => c.productId === productId);
      if (item) {
        if (qty > maxQty) {
          toast('Max available stock is ' + maxQty, 'error');
          item.qty = maxQty;
        } else {
          item.qty = qty;
        }
      }
      render();
    }

    function completeSale() {
      if (!requireDayOpen()) return;
      if (state.cart.length === 0) {
        toast('Cart is empty.', 'error');
        return;
      }
      const products = getProducts();
      for (const c of state.cart) {
        const p = products.find((x) => x.id === c.productId);
        if (!p || p.qty < c.qty) {
          toast('Insufficient stock for ' + c.name, 'error');
          return;
        }
      }

      const total = state.cart.reduce((s, c) => s + c.price * c.qty, 0);
      const paidRaw = state.amountPaid === '' ? (state.paymentMethod === 'Credit' ? 0 : total) : parseFloat(state.amountPaid);
      const paid = isNaN(paidRaw) ? 0 : paidRaw;

      if (state.paymentMethod !== 'Credit' && paid + 0.0001 < total) {
        toast('Amount paid (' + money(paid) + ') is less than total (' + money(total) + ').', 'error');
        return;
      }
      const change = Math.max(0, paid - total);

      state.cart.forEach((c) => {
        const p = products.find((x) => x.id === c.productId);
        if (p) p.qty = Math.max(0, p.qty - c.qty);
      });
      setProducts(products);

      const sales = getSales();
      const day = getDay();
      const now = new Date();
      const seq = String(sales.length + 1).padStart(4, '0');
      const sale = {
        id: uid('sale'),
        receiptNo: 'RCP-' + day.date.replace(/-/g, '') + '-' + seq,
        dayId: day.id,
        date: day.date,
        time: timeStr(now.toISOString()),
        timestamp: now.toISOString(),
        cashier: state.user.name,
        cashierUsername: state.user.username,
        paymentMethod: state.paymentMethod,
        customerRef: state.customerRef.trim(),
        items: state.cart.map((c) => ({ ...c })),
        total,
        amountPaid: paid,
        change
      };
      sales.unshift(sale);
      setSales(sales);

      let creditAdded = false;
      if (state.paymentMethod === 'Credit' && total - paid > 0.005) {
        const balanceOwed = Number((total - paid).toFixed(2));
        const credits = getCredits();
        credits.unshift({
          id: uid('cr'),
          name: state.customerRef.trim() || ('Walk-in (' + sale.receiptNo + ')'),
          phone: '',
          amountOwed: balanceOwed,
          dueDate: shiftDateStr(day.date, 7),
          status: 'Unpaid',
          saleId: sale.id,
          receiptNo: sale.receiptNo,
          createdAt: day.date,
          paidAt: '',
          recordedBy: state.user.name
        });
        setCredits(credits);
        creditAdded = true;
      }

      state.cart = [];
      state.amountPaid = '';
      state.customerRef = '';
      render();
      showReceiptModal(sale);
      toast(
        creditAdded
          ? ('Sale completed & recorded in Credit Book: ' + sale.receiptNo)
          : ('Sale completed: ' + sale.receiptNo),
        'success'
      );
    }

    async function openBarcodeScannerModal() {
      if (!requireDayOpen()) return;
      stopScannerStream();

      openModal(`
        <div class="modal-head">
          <div>
            <h3 class="modal-title">📷 Scan Product Barcode</h3>
            <div style="font-size:12px;color:var(--text-muted);">Point camera at barcode to auto-add to cart.</div>
          </div>
          <button type="button" class="btn-secondary btn-sm" id="scan-close">Close</button>
        </div>
        <video id="scan-video" class="scanner-video" autoplay playsinline muted></video>
        <div id="scan-status" class="alert-banner alert-info mt-3">Starting camera...</div>
        <form id="scan-manual-form" class="flex-row mt-2">
          <input id="scan-manual-input" type="text" placeholder="Or type / USB-scan barcode here..." style="flex:1 1 180px;" />
          <button type="submit" class="btn-primary">Lookup Barcode</button>
        </form>
      `);

      document.getElementById('scan-close').onclick = closeModal;
      document.getElementById('scan-manual-form').onsubmit = (e) => {
        e.preventDefault();
        const val = document.getElementById('scan-manual-input').value.trim();
        if (!val) return;
        closeModal();
        handleScannedBarcode(val);
      };

      const video = document.getElementById('scan-video');
      const statusEl = document.getElementById('scan-status');

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        if (statusEl) {
          statusEl.className = 'alert-banner alert-warning mt-3';
          statusEl.textContent = 'Camera API unavailable on this device/browser. Use manual barcode entry below.';
        }
        return;
      }

      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' } },
          audio: false
        });
        if (!document.getElementById('scan-video')) {
          stream.getTracks().forEach((t) => t.stop());
          return;
        }
        state.scannerStream = stream;
        video.srcObject = stream;
        await video.play();

        if (!('BarcodeDetector' in window)) {
          if (statusEl) {
            statusEl.className = 'alert-banner alert-warning mt-3';
            statusEl.textContent = 'Live camera active, but BarcodeDetector is unsupported in this browser. Type barcode below.';
          }
          return;
        }

        let detector;
        try {
          detector = new window.BarcodeDetector({
            formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'qr_code']
          });
        } catch (err) {
          detector = new window.BarcodeDetector();
        }

        if (statusEl) {
          statusEl.className = 'alert-banner alert-success mt-3';
          statusEl.textContent = 'Camera ready — hold barcode steady inside frame.';
        }

        state.scannerTimer = setInterval(async () => {
          if (!video || video.readyState < 2) return;
          try {
            const codes = await detector.detect(video);
            if (codes && codes.length > 0 && codes[0].rawValue) {
              const detected = codes[0].rawValue.trim();
              if (detected) {
                closeModal();
                handleScannedBarcode(detected);
              }
            }
          } catch (err) {}
        }, 320);
      } catch (err) {
        if (statusEl) {
          statusEl.className = 'alert-banner alert-danger mt-3';
          statusEl.textContent = 'Camera access denied or unavailable (' + err.message + '). Type barcode manually below.';
        }
      }
    }

    function bindPOS() {
      const searchEl = document.getElementById('pos-search');
      const clr = document.getElementById('pos-clear-search');
      if (searchEl) {
        searchEl.oninput = (e) => {
          state.posSearch = e.target.value;
          const wrap = document.getElementById('pos-grid-wrap');
          if (wrap) {
            wrap.innerHTML = renderPOSProductGridHtml();
            bindPOSGridTiles();
          }
          if (clr) clr.classList.toggle('hidden', !state.posSearch);
        };
        searchEl.onkeydown = (e) => {
          if (e.key === 'Enter') {
            e.preventDefault();
            const q = state.posSearch.trim().toLowerCase();
            if (!q) return;
            const match = getProducts().find((p) => (p.barcode || '').toLowerCase() === q)
              || getProducts().find((p) => p.name.toLowerCase() === q);
            if (match) {
              state.posSearch = '';
              addToCart(match.id);
              setTimeout(() => {
                const el2 = document.getElementById('pos-search');
                if (el2) el2.focus();
              }, 0);
            }
          }
        };
      }
      if (clr) {
        clr.onclick = () => {
          state.posSearch = '';
          if (searchEl) searchEl.value = '';
          clr.classList.add('hidden');
          const wrap = document.getElementById('pos-grid-wrap');
          if (wrap) {
            wrap.innerHTML = renderPOSProductGridHtml();
            bindPOSGridTiles();
          }
        };
      }

      document.querySelectorAll('[data-cat]').forEach((b) => {
        b.onclick = () => { state.posCategory = b.getAttribute('data-cat'); render(); };
      });
      bindPOSGridTiles();

      const cartClr = document.getElementById('cart-clear');
      if (cartClr) cartClr.onclick = () => { state.cart = []; render(); };

      document.querySelectorAll('[data-qty-dec]').forEach((b) => {
        b.onclick = () => {
          const id = b.getAttribute('data-qty-dec');
          const it = state.cart.find((c) => c.productId === id);
          if (it) updateCartQty(id, it.qty - 1);
        };
      });
      document.querySelectorAll('[data-qty-inc]').forEach((b) => {
        b.onclick = () => {
          const id = b.getAttribute('data-qty-inc');
          const it = state.cart.find((c) => c.productId === id);
          if (it) updateCartQty(id, it.qty + 1);
        };
      });
      document.querySelectorAll('[data-qty-input]').forEach((inp) => {
        inp.onchange = () => updateCartQty(inp.getAttribute('data-qty-input'), inp.value);
      });
      document.querySelectorAll('[data-qty-rem]').forEach((b) => {
        b.onclick = () => updateCartQty(b.getAttribute('data-qty-rem'), 0);
      });
      document.querySelectorAll('[data-pay]').forEach((b) => {
        b.onclick = () => { state.paymentMethod = b.getAttribute('data-pay'); render(); };
      });

      const paidEl = document.getElementById('pos-paid');
      if (paidEl) {
        paidEl.oninput = (e) => {
          state.amountPaid = e.target.value;
          const total = state.cart.reduce((s, c) => s + c.price * c.qty, 0);
          const paidVal = state.amountPaid === '' ? null : parseFloat(state.amountPaid);
          const effectivePaid = paidVal !== null && !isNaN(paidVal) ? paidVal : (state.paymentMethod === 'Credit' ? 0 : total);

        refEl.oninput = (e) => { state.customerRef = e.target.value; };

      document.querySelectorAll('[data-quick-cash]').forEach((b) => {
        b.onclick = () => {
          state.amountPaid = b.getAttribute('data-quick-cash');
          render();
        };

      if (scanBtn) scanBtn.onclick = openBarcodeScannerModal;

      document.getElementById('pm-close').onclick = closeModal;
      document.getElementById('pm-cancel').onclick = closeModal;
      document.getElementById('pm-form').onsubmit = (e) => {
        e.preventDefault();
        if (!requireDayOpen()) return;
        const name = document.getElementById('pm-name').value.trim();
        const barcode = document.getElementById('pm-barcode').value.trim();
        const category = document.getElementById('pm-cat').value.trim() || 'General';
        const sellingPrice = Math.max(0, parseFloat(document.getElementById('pm-sell').value) || 0);
        const costPrice = Math.max(0, parseFloat(document.getElementById('pm-cost').value) || 0);
        const qty = Math.max(0, parseInt(document.getElementById('pm-qty').value, 10) || 0);
        const lowStockLevel = Math.max(0, parseInt(document.getElementById('pm-low').value, 10) || 0);

        const list = getProducts();
        if (prod) {
          const idx = list.findIndex((p) => p.id === prod.id);
          if (idx >= 0) {
            list[idx] = { ...list[idx], name, barcode, category, sellingPrice, costPrice, qty, lowStockLevel };
          }
          toast('Product updated.', 'success');
        } else {
          list.unshift({ id: uid('p'), name, barcode, category, sellingPrice, costPrice, qty, lowStockLevel });
          toast('Product added.', 'success');
        }
        setProducts(list);
        closeModal();
        render();
      };
    }

    function confirmDeleteProduct(productId) {
      if (!hasRole(['Admin'])) {
        toast('Only Admin can delete products.', 'error');

      if (!requireDayOpen()) return;
      const prod = getProducts().find((p) => p.id === productId);
      if (!prod) return;
      openModal(`
        <div class="modal-head">
          <h3 class="modal-title">Delete Product</h3>
          <button type="button" class="btn-secondary btn-sm" id="dp-close">Cancel</button>
        </div>

          <button type="button" class="btn-secondary" id="dp-cancel">Cancel</button>
          <button type="button" class="btn-danger" id="dp-confirm">Delete Product</button>
        </div>

      document.getElementById('dp-cancel').onclick = closeModal;

    function bindPurchases() {
      const prodSel = document.getElementById('pur-prod');
      const qtyEl = document.getElementById('pur-qty');
      const costEl = document.getElementById('pur-cost');
      const totEl = document.getElementById('pur-total');

      function updatePurTotal() {
        const q = parseInt(qtyEl.value, 10) || 0;
        const c = parseFloat(costEl.value) || 0;
        totEl.textContent = money(q * c);
      }

      if (prodSel) {
        prodSel.onchange = () => {
          const opt = prodSel.options[prodSel.selectedIndex];
          if (opt) costEl.value = (parseFloat(opt.getAttribute('data-cost')) || 0).toFixed(2);
          updatePurTotal();
        };
      }
      if (qtyEl) qtyEl.oninput = updatePurTotal;
      if (costEl) costEl.oninput = updatePurTotal;

      const form = document.getElementById('pur-form');
      if (form) {
        form.onsubmit = (e) => {
          e.preventDefault();
          if (!requireDayOpen()) return;
          const supplier = document.getElementById('pur-supplier').value.trim();
          const productId = prodSel.value;
          const qty = Math.max(1, parseInt(qtyEl.value, 10) || 0);
          const unitCost = Math.max(0, parseFloat(costEl.value) || 0);

          const products = getProducts();
          const prod = products.find((p) => p.id === productId);
          if (!prod) return;

          prod.qty += qty;
          prod.costPrice = unitCost;
          setProducts(products);

          const day = getDay();
          const now = new Date();
          const purchase = {
            id: uid('pur'),
            dayId: day.id,
            date: day.date,
            time: timeStr(now.toISOString()),
            timestamp: now.toISOString(),
            supplier,
            productId: prod.id,
            productName: prod.name,
            qty,
            unitCost,
            totalCost: qty * unitCost,
            recordedBy: state.user.name
          };
          const purchases = getPurchases();
          purchases.unshift(purchase);
          setPurchases(purchases);

          toast('Added +' + qty + ' ' + prod.name + ' to stock.', 'success');
          render();
        };
      }
    }

      let intl = raw;
      if (intl.startsWith('263')) {

      } else if (intl.startsWith('0')) {

      } else {

      const msg = encodeURIComponent(

    function startNewStocktake() {
      if (!requireDayOpen()) return;
      const products = getProducts();
      state.activeStocktake = products.map((p) => ({
        productId: p.id,
        name: p.name,
        barcode: p.barcode,
        costPrice: p.costPrice,
        systemQty: p.qty,
        countedQty: p.qty
      }));
      render();
    }

    function saveAndAdjustStocktake() {
      if (!requireDayOpen()) return;
      if (!state.activeStocktake || state.activeStocktake.length === 0) return;

      const products = getProducts();
      const items = state.activeStocktake.map((row) => {
        const counted = Math.max(0, parseInt(row.countedQty, 10) || 0);
        const variance = counted - row.systemQty;
        const prod = products.find((p) => p.id === row.productId);
        if (prod) prod.qty = counted;
        return {
          productId: row.productId,
          name: row.name,
          barcode: row.barcode,
          costPrice: row.costPrice,
          systemQty: row.systemQty,
          countedQty: counted,
          variance,
          varianceValue: variance * row.costPrice
        };
      });

      setProducts(products);
      const day = getDay();
      const now = new Date();
      const record = {
        id: uid('st'),
        dayId: day.id,
        date: day.date,
        time: timeStr(now.toISOString()),
        timestamp: now.toISOString(),
        user: state.user.name,
        itemsCount: items.length,
        adjustedItems: items.filter((i) => i.variance !== 0).length,
        netVarianceUnits: items.reduce((a, i) => a + i.variance, 0),
        netVarianceValue: items.reduce((a, i) => a + i.varianceValue, 0),
        items
      };
      const stocktakes = getStocktakes();
      stocktakes.unshift(record);
      setStocktakes(stocktakes);

      state.activeStocktake = null;
      toast('Stocktake saved and system stock adjusted.', 'success');
      render();
    }

    function inDateRange(dateStr) {
      if (!dateStr) return false;
      if (state.reportFrom && dateStr < state.reportFrom) return false;
      if (state.reportTo && dateStr > state.reportTo) return false;

    function exportCSV(filename, headers, rows) {
      const escapeCell = (val) => {
        const s = String(val === null || val === undefined ? '' : val);
        return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      };
      const csv = [headers.map(escapeCell).join(','), ...rows.map((r) => r.map(escapeCell).join(','))].join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('Exported ' + filename, 'success');
    }

    function computeCashierPerformanceToday(targetDate) {
      const salesToday = getSales().filter((s) => s.date === targetDate);
      const map = new Map();
      salesToday.forEach((s) => {
        const key = (s.cashierUsername || s.cashier || 'Unknown').toLowerCase();
        const cur = map.get(key) || {
          name: s.cashier || s.cashierUsername || 'Unknown',
          transactions: 0,
          items: 0,
          salesTotal: 0
        };
        cur.transactions += 1;
        cur.items += (s.items || []).reduce((a, it) => a + (Number(it.qty) || 0), 0);
        cur.salesTotal += Number(s.total) || 0;
        map.set(key, cur);
      });
      return Array.from(map.values()).sort((a, b) => b.salesTotal - a.salesTotal);
    }

            products.map((p) => [p.name, p.barcode, p.category, p.qty, p.costPrice.toFixed(2), p.sellingPrice.toFixed(2), (p.qty * p.costPrice).toFixed(2), p.lowStockLevel])

        const purchases = getPurchases().filter((x) => inDateRange(x.date));
        const expenses = getExpenses().filter((x) => inDateRange(x.date));
        const products = getProducts();

        const blocks = [
          { text: s.businessName, align: 1, bold: true, large: true },
          { text: state.reportTab.toUpperCase() + ' REPORT', align: 1, bold: true },
          { text: state.reportFrom + ' to ' + state.reportTo, align: 1 },
          { text: hr, align: 0 }
        ];

        if (state.reportTab === 'sales') {
          const total = sales.reduce((a, x) => a + x.total, 0);
          blocks.push({ text: lrLine('Transactions:', String(sales.length), w), align: 0 });
          blocks.push({ text: lrLine('Total Sales:', money(total), w), align: 0, bold: true });
          sales.slice(0, 20).forEach((x) => {
            blocks.push({ text: lrLine(x.receiptNo.slice(-9) + ' ' + x.paymentMethod, money(x.total), w), align: 0 });
          });
        } else if (state.reportTab === 'expenses') {
          const totalS = sales.reduce((a, x) => a + x.total, 0);
          const totalP = purchases.reduce((a, x) => a + x.totalCost, 0);
          const totalE = expenses.reduce((a, x) => a + x.amount, 0);
          blocks.push({ text: lrLine('Sales:', money(totalS), w), align: 0 });
          blocks.push({ text: lrLine('Purchases:', money(totalP), w), align: 0 });
          blocks.push({ text: lrLine('Expenses:', money(totalE), w), align: 0 });
          blocks.push({ text: lrLine('Net Profit:', money(totalS - totalP - totalE), w), align: 0, bold: true });
        } else if (state.reportTab === 'purchases') {
          const total = purchases.reduce((a, x) => a + x.totalCost, 0);
          blocks.push({ text: lrLine('Entries:', String(purchases.length), w), align: 0 });
          blocks.push({ text: lrLine('Total Purchases:', money(total), w), align: 0, bold: true });
        } else if (state.reportTab === 'stock') {
          const val = products.reduce((a, p) => a + p.qty * p.costPrice, 0);
          blocks.push({ text: lrLine('Total SKUs:', String(products.length), w), align: 0 });
          blocks.push({ text: lrLine('Stock Value:', money(val), w), align: 0, bold: true });
        } else {
          const sts = getStocktakes().filter((x) => inDateRange(x.date));
          blocks.push({ text: lrLine('Stocktakes:', String(sts.length), w), align: 0 });
        }
        printViaBluetooth(blocks);
      };
    }

    function randomLicSegment(len) {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      let out = '';
      for (let i = 0; i < len; i++) {
        out += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return out;
    }

    function buildUniqueLicenseCode(plan, existingSet) {
      const prefix = plan === 'yearly' ? 'TINA-YEAR-' : 'TINA-MONTH-';
      let code = '';
      do {
        code = prefix + randomLicSegment(4) + '-' + randomLicSegment(4);
      } while (existingSet.has(code));
      existingSet.add(code);
      return code;
    }

    function buildWhatsAppCodeHref(lic) {
      const planText = lic.plan === 'yearly' ? 'Yearly ($50.00 / 365 days)' : 'Monthly ($6.00 / 30 days)';
      const msg = encodeURIComponent(
        'Tina POS & Stock Management License Code:\n' +
        'Code: ' + lic.code + '\n' +
        'Plan: ' + planText + '\n' +
        'Open Tina POS -> Enter License Code -> ACTIVATE NOW.\n' +
        'Support: ' + WHATSAPP_DISPLAY
      );
      return WHATSAPP_BASE + '?text=' + msg;
    }

    function renderLicenseTableRowsHtml(list) {
      if (list.length === 0) {
        return '<tr><td colspan="6" style="text-align:center;padding:26px;color:var(--text-muted);">No license codes match your filter.</td></tr>';
      }
      return list.map((l) => {
        const badgeCls = l.status === 'Unused' ? 'unused' : (l.status === 'Used' ? 'used' : 'revoked');
        const planTxt = l.plan === 'yearly' ? 'Yearly $50.00 (365d)' : 'Monthly $6.00 (30d)';
        return `
          <tr>
            <td class="tabular"><strong>${esc(l.code)}</strong></td>
            <td>${esc(planTxt)}</td>
            <td><span class="lic-badge ${badgeCls}">${esc(l.status)}</span></td>
            <td>${esc(l.usedBy || '-')}</td>
            <td class="tabular">${esc(l.createdAt || '-')}</td>
            <td class="text-right">
              <div class="flex-row" style="justify-content:flex-end;">
                <button type="button" class="btn-secondary btn-sm" data-lic-copy="${esc(l.code)}">Copy</button>
                <a class="wa-link-btn sm" href="${buildWhatsAppCodeHref(l)}" target="_blank" rel="noopener noreferrer">Send via WhatsApp</a>
                ${l.status !== 'Revoked'
                  ? `<button type="button" class="btn-danger btn-sm" data-lic-revoke="${esc(l.id)}">Revoke Code</button>`
                  : '<span style="font-size:11px;color:var(--danger);font-weight:700;">Revoked</span>'}
              </div>

          </tr>
        `;
      }).join('');
    }
